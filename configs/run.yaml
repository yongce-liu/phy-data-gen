template_root: data/templates/cosmos3/objects_falling
asset_root: data/assets/molmospaces
registry_path: data/assets/registry.json
output_root: outputs

backend: physx
seed: 42
template_seed: 42
num_objects: 0

# Prims resolved from the Cosmos template (see inspect_template output).
scene:
  name: objects_falling
  object_mode: replace_assets
  world_prim: /World
  physics_scene_prim: /PhysicsScene
  ground_prim: /World/Ground
  cameras:
    Side: /World/Camera_Side
    Corner: /World/Camera_Corner
    OtherSide: /World/Camera_OtherSide
    TopDown: /World/Camera_TopDown
  # Empty means that every rigid body below world_prim is replaced in place.
  dynamic_prims: []

simulation:
  physics_dt: 0.0020833333333333333
  render_fps: 30
  duration_seconds: 5.0

render:
  width: 1920
  height: 1080
  # Depth is quantized to unsigned 16-bit millimeters before lossless FFV1 encoding.
  depth_scale_meters: 0.001
  # NVIDIA hardware encoding avoids blocking simulation on CPU H.264 encoding.
  rgb_encoder: h264_nvenc
