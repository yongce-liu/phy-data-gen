# Category 01 — two-ball collision (head-on / oblique / eccentric / elastic /
# inelastic / completely inelastic / equal & unequal mass / one or both moving /
# with spin). Uses the billiards table as backdrop with template balls removed.

category: category_01_two_ball_collision

template_root: data/templates/cosmos3/billiards
asset_root: data/assets/molmospaces
registry_path: data/assets/registry.json
output_root: outputs/category_01

backend: physx
seed: 42
# Leave template_seed unset so each episode picks a *different* Cosmos
# billiards template — each carries a different dome environment + table
# finish, which is the main background-diversity lever.
num_objects: 0

scene:
  name: category_01
  object_mode: procedural
  replace_initially_moving_objects: false
  world_prim: /World
  physics_scene_prim: /PhysicsScene
  ground_prim: /World/TableSurface

  cameras:
    Side: /World/Camera_Side
    Front: /World/Camera_Front
    Top: /World/Camera_Top
    Action: /World/Camera_Action

  dynamic_prims: []

simulation:
  physics_dt: 0.004166666666666667   # 1/240
  render_fps: 30
  duration_seconds: 5.0

render:
  width: 1280
  height: 720
  depth_scale_meters: 0.001
  rgb_encoder: h264_nvenc
