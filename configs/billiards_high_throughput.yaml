# High-throughput billiards config — optimized for RTX 5090
# Changes from baseline:
#   - 1280×720 resolution  (was 1920×1080 → 56% fewer pixels)
#   - 240 Hz physics dt    (was 480 Hz → half the sim steps, adequate with CCD)
#   - Keep 4 cameras, 30 fps capture, 5 s duration

template_root: data/templates/cosmos3/billiards
asset_root: data/assets/molmospaces
registry_path: data/assets/registry.json
output_root: outputs/billiards

backend: physx
seed: 42
template_seed: 42
num_objects: 0

scene:
  name: billiards
  object_mode: replace_assets
  replace_initially_moving_objects: false
  world_prim: /World
  physics_scene_prim: /PhysicsScene
  ground_prim: /World/TableSurface

  cameras:
    BehindCue: /World/Camera_BehindCue
    ImpactZone: /World/Camera_ImpactZone
    TopDown: /World/Camera_TopDown
    Corner: /World/Camera_Corner

  dynamic_prims: []

simulation:
  physics_dt: 0.004166666666666667   # 1/240 = 1200 steps per 5s episode
  render_fps: 30
  duration_seconds: 5.0

render:
  width: 1280
  height: 720
  depth_scale_meters: 0.001
  rgb_encoder: h264_nvenc
